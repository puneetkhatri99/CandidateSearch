[project]
name = "candidate-search-backend"
version = "0.1.0"
description = "Candidate sourcing and ranking API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.32",
    "alembic>=1.20",
    "structlog>=26.1",
    "email-validator>=2.3",
    "pycountry>=26.2",
    "argon2-cffi>=25.1",
    # Embeddings: the official OpenAI SDK (retries, Retry-After) and the httpx2 client it runs on.
    # Pinned exactly: 3.31.0 is the last release that has had time to settle (3.41.0 was 1 day old).
    "openai==3.31.0",
    "httpx2==2.16.0",
]

[project.optional-dependencies]
dev = [
    # FastAPI test client transport only; the app itself no longer imports httpx.
    "httpx>=0.28",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
    "mypy>=2.4",
    "faker>=40.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "ASYNC", "SIM", "RUF", "PTH", "T20"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S311"]
# The root conftest sets env vars before importing the app, on purpose.
"conftest.py" = ["S101", "E402"]
"migrations/versions/*" = ["E501", "W291"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["app", "tests"]
markers = ["integration: needs a real PostgreSQL database"]